version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: biopack_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/biopack.db
      - RECOMMENDATION_DATASET_PATH=/packAI/fssai_packaging_recommendation_dataset_5000_samples - Untitled.csv
      - SIMULATION_DATASET_PATH=/packAI/fssai_shelf_life_simulation_dataset_5000_samples - Untitled.csv
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: biopack_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
